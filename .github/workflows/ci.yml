name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    name: Shellcheck
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Analyze Bash and POSIX shell scripts
        run: |
          shellcheck --severity=warning -e SC1091 -e SC2155 -s bash bin/dotfiles tests/*.sh scripts/linux/*.sh
          shellcheck --severity=warning -s sh packages/git/.config/git/hooks/pre-commit tests/fixtures/secret-backend
      # Zsh uses its native parser in the configuration validation step below.

  shfmt:
    runs-on: ubuntu-latest
    name: Shell Format Check
    steps:
      - uses: actions/checkout@v4
      - name: Install shfmt
        run: |
          curl -sL https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64 -o shfmt
          chmod +x shfmt
          sudo mv shfmt /usr/local/bin/
      - name: Check shell script formatting
        run: |
          shfmt -d -i 4 -ci bin/dotfiles
          find . -name "*.sh" -not -path "./.git/*" -print0 | xargs -0 -r shfmt -d -i 4 -ci

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: Integration tests (${{ matrix.os }})
    env:
      TERM: dumb
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y stow fish zsh neovim
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install stow fish zsh neovim
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install configuration parser dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Test configuration validation
        run: python -B tests/test_config_validation.py
      - name: Validate active POSIX configuration syntax
        run: python -B tests/validate_configs.py
      - name: Check dotfiles command syntax
        run: bash -n bin/dotfiles tests/test-dotfiles.sh
      - name: Run dotfiles integration tests
        run: ./tests/test-dotfiles.sh
      - name: Test secret loading with offline backends
        run: bash tests/test-secret-loading.sh
