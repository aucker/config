name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  secrets:
    runs-on: ubuntu-latest
    name: Secret scanning
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install checksum-verified Gitleaks 8.30.1
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Test staged scanning and commit rejection
        run: python3 -B tests/test_secret_scanning.py
      - name: Scan repository files
        run: python3 -B scripts/check_secrets.py worktree
      - name: Scan newly introduced commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            python3 -B scripts/check_secrets.py history --log-opts="$BASE_SHA..$HEAD_SHA"
          else
            python3 -B scripts/check_secrets.py history --log-opts="$HEAD_SHA"
          fi

  shellcheck:
    runs-on: ubuntu-latest
    name: Shellcheck
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Analyze Bash and POSIX shell scripts
        run: |
          shellcheck --severity=warning -e SC1091 -e SC2155 -s bash bin/dotfiles tests/*.sh scripts/linux/*.sh
          shellcheck --severity=warning -s sh packages/git/.config/git/hooks/pre-commit tests/fixtures/secret-backend
      # Zsh uses its native parser in the configuration validation step below.

  shfmt:
    runs-on: ubuntu-latest
    name: Shell Format Check
    steps:
      - uses: actions/checkout@v4
      - name: Install shfmt
        run: |
          curl -sL https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64 -o shfmt
          chmod +x shfmt
          sudo mv shfmt /usr/local/bin/
      - name: Check shell script formatting
        run: |
          shfmt -d -i 4 -ci bin/dotfiles
          find . -name "*.sh" -not -path "./.git/*" -print0 | xargs -0 -r shfmt -d -i 4 -ci

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: Integration tests (${{ matrix.os }})
    env:
      TERM: dumb
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y stow fish zsh neovim
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install stow fish zsh neovim
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install configuration parser dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Test configuration validation
        run: python -B tests/test_config_validation.py
      - name: Validate active POSIX configuration syntax
        run: python -B tests/validate_configs.py
      - name: Check dotfiles command syntax
        run: bash -n bin/dotfiles tests/test-dotfiles.sh
      - name: Run dotfiles integration tests
        run: ./tests/test-dotfiles.sh
      - name: Test secret loading with offline backends
        run: bash tests/test-secret-loading.sh
